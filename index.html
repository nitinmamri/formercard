<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌱AgriStack Farmer Card</title>
  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial,sans-serif;
    }

    body{
      background:#f0f0f0;
      padding:20px;
    }

    .form-box{
      max-width:1100px;
      margin:auto;
      background:#fff;
      padding:20px;
      border-radius:10px;
      box-shadow:0 0 10px rgba(0,0,0,.15);
      margin-bottom:20px;
    }

    textarea{
      width:100%;
      height:250px;
      padding:10px;
      border:1px solid #ccc;
      border-radius:5px;
      font-size:14px;
    }

    button{
      padding:10px 20px;
      background:#1b5e20;
      color:#fff;
      border:none;
      border-radius:5px;
      cursor:pointer;
      margin-top:10px;
      margin-right:8px;
    }

    select{
      padding:8px 10px;
      border:1px solid #ccc;
      border-radius:5px;
      margin-top:10px;
    }

    input[type="file"]{
      margin-top:10px;
    }

    .card-container{
      display:none;
      justify-content:center;
      gap:30px;
      flex-wrap:wrap;
    }

    .card{
      width:520px;
      min-height:360px;
      background:#fff;
      border:1.5px solid #1b5e20;
      border-radius:20px;
      overflow:hidden;
      display:flex;
      flex-direction:column;
      box-shadow:0 0 10px rgba(0,0,0,.10);
    }

    .card-front {
      background-image: url('https://lh3.googleusercontent.com/d/1q4YD0eum9qjBncST5oZjEHsS7_duZAzT=w300');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      position: relative;
    }

    .card-front .content {
      background: rgba(255, 255, 255, 0.50);
      border-radius: 0 0 20px 20px;
    }

    .card-front .header {
      background: rgba(27, 94, 32, 0.90);
    }

    .card-front .id-wrap {
      background: rgba(255,255,255,0.55);
      padding: 0px 15px 1px 15px;

    }

    .card-front .bottom-note {
      background: rgba(27, 94, 32, 0.92);
    }

    .card-back {

      background-position: center;
      background-repeat: no-repeat;

    }

    .card-back .header {
      background: rgba(27, 94, 32, 0.9);

      font-size:18px;

    .detail-row b{

      align-items:flex-start;

      flex-shrink:0;
      margin-top:50px;

      border:1px solid #bbb;
      padding:4px;
      background:#fff;
      border-radius:8px;

      text-align:center;

      font-size:13px;

    .address{

    .land-header{

    .land-title{

    .total-area{

    table{

      font-size:11px;

      white-space:normal;

<body>

  <div class="form-box">
    <h2>AgriStack Data Paste Here</h2>
    <textarea id="rawData" placeholder="Paste farmer registration data here..."></textarea>
    <br><br>

    <label for="genderSelect"><b>Gender:</b></label><br>
    <select id="genderSelect">
      <option value="">Select</option>
      <option value="Male">Male</option>
      <option value="Female">Female</option>
    </select>
    <br><br>

    <input type="file" id="photoInput" accept="image/*">
    <img id="photoPreview" style="display:none;max-width:130px;max-height:160px;margin-top:10px;">
    <br>

    <button onclick="generateCard()">Generate Card</button>
    <button onclick="window.print()">Print</button>
  </div>

  <div class="card-container" id="cards"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>
    document.getElementById("photoInput").addEventListener("change", function(e){
      const file = e.target.files[0];
      if(file){
        const reader = new FileReader();
        reader.onload = function(ev){
          const preview = document.getElementById("photoPreview");
          preview.src = ev.target.result;
          preview.style.display = "block";
        };
        reader.readAsDataURL(file);
      }
    });

    function normalizeText(text){
      return String(text || "")
        .replace(/\r/g, "")
        .replace(/\u00A0/g, " ")
        .trim();
    }

    function findValueByLabels(lines, labels){
      for(let i = 0; i < lines.length; i++){
        const current = normalizeText(lines[i]);
        const currentLower = current.toLowerCase();

        for(const label of labels){
          const labelLower = label.toLowerCase();

          if(currentLower.includes(labelLower) && current.includes(":")){
            const parts = current.split(":");
            if(parts.length > 1){
              const left = parts[0].trim().toLowerCase();
              if(left.includes(labelLower) || left === labelLower){
                const val = normalizeText(parts.slice(1).join(":"));
                if(val && !val.toLowerCase().includes("enter") && !val.toLowerCase().includes("select") && !val.toLowerCase().includes("verified") && !val.toLowerCase().includes("pending")){
                  return val;
                }
              }
            }
          }

          if(currentLower === labelLower || currentLower === labelLower + ":") {
            if(i + 1 < lines.length) {
              const next = normalizeText(lines[i + 1]);
              if(next && !next.toLowerCase().includes("verified") && 
                 !next.toLowerCase().includes("reset") &&
                 !next.toLowerCase().includes("enter") &&
                 !next.toLowerCase().includes("select") &&
                 !next.toLowerCase().includes("insert") &&
                 !next.toLowerCase().includes("pending") &&
                 !next.toLowerCase().includes("re-ekyc") &&
                 !next.toLowerCase().includes("download")){
                return next;
              }
            }
          }
        }
      }
      return "";
    }

    function getFatherName(lines){
      let fatherEnglish = "";
      let fatherHindi = "";
      
      for(let i=0;i<lines.length;i++){
        const line = lines[i];
        const lower = line.toLowerCase();
        
        if(lower.includes("identifier name in english") || lower.includes("identifier name (english)")){
          if(line.includes(":")){
            const val = line.split(":").slice(1).join(":").trim();
            if(val && !val.toLowerCase().includes("enter") && !val.toLowerCase().includes("select")){
              fatherEnglish = val;
            }
          } else if(i+1 < lines.length){
            const next = lines[i+1].trim();
            if(next && !next.toLowerCase().includes("identifier") && !next.toLowerCase().includes("enter")){
              fatherEnglish = next;
            }
          }
        }
        
        if(lower.includes("identifier name in local language") || lower.includes("identifier name (local)")){
          if(line.includes(":")){
            const val = line.split(":").slice(1).join(":").trim();
            if(val && !val.toLowerCase().includes("enter") && !val.toLowerCase().includes("select")){
              fatherHindi = val;
            }
          } else if(i+1 < lines.length){
            const next = lines[i+1].trim();
            if(next && !next.toLowerCase().includes("identifier") && !next.toLowerCase().includes("enter")){
              fatherHindi = next;
            }
          }
        }
      }
      
      return { fatherEnglish, fatherHindi };
    }

    function getFarmerId(lines){
      for(let i=0;i<lines.length;i++){
        const line = lines[i];
        if(line.toLowerCase().includes("farmer id") && !line.toLowerCase().includes("enrollment")){
          if(line.includes(":")){
            const val = line.split(":").slice(1).join(":").trim();
            if(val && /^\d+$/.test(val) && val.length >= 10){
              return val;
            }
          } else if(i+1 < lines.length){
            const next = lines[i+1].trim();
            if(next && /^\d+$/.test(next) && next.length >= 10 && !next.includes('_')){
              return next;
            }
          }
        }
      }
      
      for(let i=0;i<lines.length;i++){
        const line = lines[i];
        if(line.includes('_')){
          continue;
        }
        const match = line.match(/\b(\d{10,12})\b/);
        if(match && match[1]){
          const aadhaar = findValueByLabels(lines, ["Aadhaar Number", "Aadhar Number"]);
          if(match[1] !== aadhaar.replace(/\s/g, '')){
            return match[1];
          }
        }
      }
      return "";
    }

    function getEnrollmentId(lines){
      for(let i=0;i<lines.length;i++){
        const line = lines[i];
        const match = line.match(/\b(\d+_\d+_\d+_\d+_\d+)\b/);
        if(match && match[1]){
          return match[1];
        }
      }
      
      for(let i=0;i<lines.length;i++){
        const line = lines[i];
        if(line.toLowerCase().includes("farmer enrollment") || line.toLowerCase().includes("enrollment id")){
          if(line.includes(":")){
            const val = line.split(":").slice(1).join(":").trim();
            if(val && val.includes('_')){
              return val;
            }
          } else if(i+1 < lines.length){
            const next = lines[i+1].trim();
            if(next && next.includes('_')){
              return next;
            }
          }
        }
      }
      return "";
    }

    function escapeHtml(text){
      return String(text || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
    }

    function computeTotalArea(entries){
      let total = 0;
      for(let e of entries){
        const a = parseFloat(e.area);
        if(!isNaN(a)) total += a;
      }
      return total.toFixed(3);
    }

    function parseLandEntries(lines){
      const entries = [];
      
      // Try to parse the new tabular format
      let tableStart = -1;
      for(let i = 0; i < lines.length; i++){
        const line = lines[i];
        if(line.includes("State/UT") && line.includes("District") && line.includes("Sub District") && line.includes("Village") && line.includes("Survey Number")){
          tableStart = i;
          break;
        }
      }
      
      if(tableStart !== -1){
        let rowStart = tableStart + 1;
        while(rowStart < lines.length){
          const row = lines[rowStart];
          if(row && row.length > 5 && !row.toLowerCase().includes("farmer") && !row.toLowerCase().includes("total") && !row.toLowerCase().includes("note:")){
            const parts = row.split(/\t+/);
            if(parts.length >= 16){
              const state = parts[0]?.trim() || "";
              const district = parts[1]?.trim() || "";
              const tehsil = parts[2]?.trim() || "";
              const village = parts[3]?.trim() || "";
              const survey = parts[4]?.trim() || "";
              const area = parts[15]?.trim() || parts[13]?.trim() || parts[12]?.trim() || "0.000";
              
              if(state && district && tehsil && village && survey && /^\d+$/.test(survey)){
                entries.push({
                  state: state,
                  dist: district,
                  tehsil: tehsil,
                  village: village,
                  khasra: survey,
                  area: area
                });
              }
            } else if(parts.length >= 5){
              const state = parts[0]?.trim() || "";
              const district = parts[1]?.trim() || "";
              const tehsil = parts[2]?.trim() || "";
              const village = parts[3]?.trim() || "";
              const survey = parts[4]?.trim() || "";
              let area = "0.000";
              for(let k = 5; k < parts.length; k++){
                if(/^\d+\.\d+$/.test(parts[k]) && parts[k] !== "0.000000" && parts[k] !== "0.000"){
                  area = parts[k];
                  break;
                }
              }
              
              if(state && district && tehsil && village && survey && /^\d+$/.test(survey)){
                entries.push({
                  state: state,
                  dist: district,
                  tehsil: tehsil,
                  village: village,
                  khasra: survey,
                  area: area
                });
              }
            }
            rowStart++;
          } else {
            break;
          }
        }
        
        if(entries.length > 0){
          return entries;
        }
      }
      
      // Try old format
      for(let i = 0; i < lines.length; i++){
        const line = lines[i];
        if(line === "UTTAR PRADESH" || line === "State" || line === "State/UT"){
          let dist = "", tehsil = "", village = "", khasra = "", area = "";
          
          let idx = i + 1;
          while(idx < lines.length && (lines[idx].toLowerCase().includes("farmer") || lines[idx].toLowerCase().includes("total") || lines[idx].toLowerCase().includes("note:"))){
            idx++;
          }
          if(idx < lines.length && !lines[idx].match(/^\d+$/) && !lines[idx].includes("_") && !lines[idx].toLowerCase().includes("verified")){
            dist = lines[idx];
          }
          
          idx++;
          while(idx < lines.length && (lines[idx].toLowerCase().includes("farmer") || lines[idx].toLowerCase().includes("total") || lines[idx].toLowerCase().includes("note:"))){
            idx++;
          }
          if(idx < lines.length && !lines[idx].match(/^\d+$/) && !lines[idx].includes("_") && !lines[idx].toLowerCase().includes("verified")){
            tehsil = lines[idx];
          }
          
          idx++;
          while(idx < lines.length && (lines[idx].toLowerCase().includes("farmer") || lines[idx].toLowerCase().includes("total") || lines[idx].toLowerCase().includes("note:"))){
            idx++;
          }
          if(idx < lines.length && !lines[idx].match(/^\d+$/) && !lines[idx].includes("_") && !lines[idx].toLowerCase().includes("verified")){
            village = lines[idx];
          }
          
          idx++;
          while(idx < lines.length && (lines[idx].toLowerCase().includes("farmer") || lines[idx].toLowerCase().includes("total") || lines[idx].toLowerCase().includes("note:"))){
            idx++;
          }
          if(idx < lines.length && /^\d+$/.test(lines[idx])){
            khasra = lines[idx];
          }
          
          for(let j = idx+1; j < Math.min(idx+15, lines.length); j++){
            if(/^\d+\.\d+$/.test(lines[j]) && lines[j] !== "0.000000" && lines[j] !== "0.000"){
              area = lines[j];
              break;
            }
          }
          
          if(dist && tehsil && village && khasra && /^\d+$/.test(khasra)){
            entries.push({
              state: "UTTAR PRADESH",
              dist: dist,
              tehsil: tehsil,
              village: village,
              khasra: khasra,
              area: area || "0.000"
            });
          }
        }
      }
      
      return entries;
    }

    function extractAddressDetails(lines){
      let village = "", tehsil = "", district = "", state = "", pin = "";
      
      // FIRST: Look for Residential Details section
      let inResidential = false;
      let foundState = false;
      let foundVillage = false;
      
      for(let i = 0; i < lines.length; i++){
        const line = lines[i];
        if(line.toLowerCase().includes("residential details")){
          inResidential = true;
          continue;
        }
        if(inResidential && line && !line.toLowerCase().includes("residential") && !line.toLowerCase().includes("insert") && !line.toLowerCase().includes("farmer") && !line.toLowerCase().includes("address in")){
          
          // Check for State/UT
          if(line === "UTTAR PRADESH" || line === "State/UT" || line === "State" || line === "UTTAR PRADESH"){
            state = "UTTAR PRADESH";
            foundState = true;
            
            // Get District (next valid line)
            let idx = i + 1;
            while(idx < lines.length && (lines[idx].toLowerCase().includes("farmer") || lines[idx].toLowerCase().includes("total") || lines[idx].toLowerCase().includes("note:") || lines[idx].match(/^\d+$/) || lines[idx].includes("_") || lines[idx].toLowerCase().includes("verified") || lines[idx].toLowerCase().includes("enter"))){
              idx++;
            }
            if(idx < lines.length && !lines[idx].toLowerCase().includes("sub district") && !lines[idx].toLowerCase().includes("taluka") && !lines[idx].toLowerCase().includes("pin")){
              district = lines[idx];
            }
            
            // Get Sub District/Taluka
            idx++;
            while(idx < lines.length && (lines[idx].toLowerCase().includes("farmer") || lines[idx].toLowerCase().includes("total") || lines[idx].toLowerCase().includes("note:") || lines[idx].match(/^\d+$/) || lines[idx].includes("_") || lines[idx].toLowerCase().includes("verified") || lines[idx].toLowerCase().includes("enter"))){
              idx++;
            }
            if(idx < lines.length && !lines[idx].toLowerCase().includes("district") && !lines[idx].toLowerCase().includes("pin") && !lines[idx].toLowerCase().includes("village")){
              tehsil = lines[idx];
            }
            
            // Get Village
            idx++;
            while(idx < lines.length && (lines[idx].toLowerCase().includes("farmer") || lines[idx].toLowerCase().includes("total") || lines[idx].toLowerCase().includes("note:") || lines[idx].match(/^\d+$/) || lines[idx].includes("_") || lines[idx].toLowerCase().includes("verified") || lines[idx].toLowerCase().includes("enter"))){
              idx++;
            }
            if(idx < lines.length && !lines[idx].toLowerCase().includes("sub district") && !lines[idx].toLowerCase().includes("taluka") && !lines[idx].toLowerCase().includes("pin") && !lines[idx].toLowerCase().includes("district")){
              village = lines[idx];
              foundVillage = true;
            }
            break;
          }
        }
      }
      
      // SECOND: If village not found, get from Address In English
      if(!foundVillage || !village || village.toLowerCase().includes("sub district") || village.toLowerCase().includes("taluka")){
        const addressEn = findValueByLabels(lines, ["Address In English", "Address in English"]);
        if(addressEn && !addressEn.toLowerCase().includes("enter")) {
          let cleanAddr = addressEn.replace(/,$/, '').trim();
          if(cleanAddr && !cleanAddr.toLowerCase().includes("sub district") && !cleanAddr.toLowerCase().includes("taluka") && !cleanAddr.toLowerCase().includes("address")){
            village = cleanAddr;
            foundVillage = true;
          }
        }
      }
      
      // THIRD: If still no village, try to find from Residential Details lines
      if(!foundVillage){
        let inResidential2 = false;
        for(let i = 0; i < lines.length; i++){
          const line = lines[i];
          if(line.toLowerCase().includes("residential details")){
            inResidential2 = true;
            continue;
          }
          if(inResidential2 && line && !line.toLowerCase().includes("residential") && !line.toLowerCase().includes("insert") && !line.toLowerCase().includes("farmer") && !line.toLowerCase().includes("address in") && !line.toLowerCase().includes("state/ut") && !line.toLowerCase().includes("district") && !line.toLowerCase().includes("sub district") && !line.toLowerCase().includes("pin")){
            // Check if this looks like a village name (not a number, not containing special chars, not a label)
            const cleanLine = line.trim();
            if(cleanLine && cleanLine.length > 1 && !cleanLine.match(/^\d+$/) && !cleanLine.includes('_') && !cleanLine.toLowerCase().includes('verified') && !cleanLine.toLowerCase().includes('enter')){
              // Check if it's a valid village name
              if(!state && (cleanLine === "UTTAR PRADESH" || cleanLine === "State/UT")){
                state = "UTTAR PRADESH";
                continue;
              }
              if(!district && !cleanLine.toLowerCase().includes('taluka') && !cleanLine.toLowerCase().includes('sub district')){
                district = cleanLine;
                continue;
              }
              if(!tehsil && !cleanLine.toLowerCase().includes('district') && !cleanLine.toLowerCase().includes('village')){
                tehsil = cleanLine;
                continue;
              }
              if(!village && !cleanLine.toLowerCase().includes('taluka') && !cleanLine.toLowerCase().includes('sub district') && !cleanLine.toLowerCase().includes('district') && !cleanLine.toLowerCase().includes('pin')){
                village = cleanLine;
                break;
              }
            }
          }
        }
      }
      
      // FOURTH: Try from Land Details
      if(!state || !district || !tehsil || !village){
        let inLandDetails = false;
        for(let i = 0; i < lines.length; i++){
          const line = lines[i];
          if(line.toLowerCase().includes("land details") || line.toLowerCase().includes("land ownership")){
            inLandDetails = true;
            continue;
          }
          if(inLandDetails && (line === "UTTAR PRADESH" || line === "State" || line === "State/UT")){
            if(!state) state = "UTTAR PRADESH";
            let idx = i + 1;
            while(idx < lines.length && (lines[idx].toLowerCase().includes("farmer") || lines[idx].toLowerCase().includes("total") || lines[idx].toLowerCase().includes("note:") || lines[idx].toLowerCase().includes("survey") || lines[idx].match(/^\d+$/))){
              idx++;
            }
            if(idx < lines.length && !lines[idx].toLowerCase().includes("verified") && !lines[idx].toLowerCase().includes("area") && !lines[idx].toLowerCase().includes("sub district")){
              if(!district) district = lines[idx];
            }
            idx++;
            while(idx < lines.length && (lines[idx].toLowerCase().includes("farmer") || lines[idx].toLowerCase().includes("total") || lines[idx].toLowerCase().includes("note:") || lines[idx].toLowerCase().includes("survey") || lines[idx].match(/^\d+$/))){
              idx++;
            }
            if(idx < lines.length && !lines[idx].toLowerCase().includes("verified") && !lines[idx].toLowerCase().includes("area") && !lines[idx].toLowerCase().includes("village")){
              if(!tehsil) tehsil = lines[idx];
            }
            idx++;
            while(idx < lines.length && (lines[idx].toLowerCase().includes("farmer") || lines[idx].toLowerCase().includes("total") || lines[idx].toLowerCase().includes("note:") || lines[idx].toLowerCase().includes("survey") || lines[idx].match(/^\d+$/))){
              idx++;
            }
            if(idx < lines.length && !lines[idx].toLowerCase().includes("verified") && !lines[idx].toLowerCase().includes("area") && !lines[idx].toLowerCase().includes("pin")){
              if(!village) village = lines[idx];
            }
            break;
          }
        }
      }
      
      // FIFTH: Try findValueByLabels
      if(!state) state = findValueByLabels(lines, ["State", "State/UT"]);
      if(!district) district = findValueByLabels(lines, ["District"]);
      if(!tehsil) tehsil = findValueByLabels(lines, ["Sub District", "Sub District/Taluka", "Tehsil"]);
      
      // Get PIN
      pin = findValueByLabels(lines, ["PIN Code", "Pincode", "PIN"]);
      if(!pin || pin.toLowerCase().includes("enter")){
        for(let i=0; i<lines.length; i++){
          const match = lines[i].match(/\b(262802|262\d{3}|2\d{5}|[0-9]{6})\b/);
          if(match && match[1] && match[1].length === 6){
            pin = match[1];
            break;
          }
        }
      }
      
      // Clean up: Remove label text from values
      const removePatterns = ["Sub District/Taluka", "Sub District", "Taluka", "State/UT", "District", "Village", "PIN Code"];
      for(let pattern of removePatterns){
        if(village && village.toLowerCase().includes(pattern.toLowerCase())){
          village = "";
        }
        if(tehsil && tehsil.toLowerCase().includes(pattern.toLowerCase())){
          tehsil = "";
        }
        if(district && district.toLowerCase().includes(pattern.toLowerCase())){
          district = "";
        }
      }
      
      // If village is empty but we have address from Address In English, use that
      if(!village){
        const addr = findValueByLabels(lines, ["Address In English", "Address in English"]);
        if(addr && !addr.toLowerCase().includes("enter")){
          village = addr.replace(/,$/, '').trim();
        }
      }
      
      return { village, tehsil, district, state, pin };
    }

    function generateCard(){
      const data = document.getElementById("rawData").value;
      if(!data.trim()){
        alert("Please paste farmer data first!");
        return;
      }
      
      const lines = data.split("\n").map(l => normalizeText(l)).filter(Boolean);
      const cardsContainer = document.getElementById("cards");
      cardsContainer.innerHTML = "";

      let photoSrc = "https://via.placeholder.com/130x160?text=Photo";
      const preview = document.getElementById("photoPreview");
      if(preview.style.display === "block" && preview.src){
        photoSrc = preview.src;
      }

      let farmerId = getFarmerId(lines);
      let enrollmentId = getEnrollmentId(lines);
      let aadhaar = findValueByLabels(lines, ["Aadhaar Number", "Aadhar Number"]);
      let mobile = findValueByLabels(lines, ["Mobile Number", "Mobile"]);
      let dob = findValueByLabels(lines, ["Date Of Birth", "DOB"]);
      let genderValue = document.getElementById("genderSelect").value || findValueByLabels(lines, ["Gender"]);

      const father = getFatherName(lines);
      let fatherEnglish = father.fatherEnglish || "N/A";
      let fatherHindi = father.fatherHindi || "N/A";

      // Extract address details using the improved function
      const addressDetails = extractAddressDetails(lines);
      let village = addressDetails.village;
      let tehsil = addressDetails.tehsil;
      let district = addressDetails.district;
      let state = addressDetails.state;
      let pin = addressDetails.pin;

      let farmerEnglish = "Farmer Name";
      let farmerHindi = "किसान का नाम";

      for(let i=0;i<lines.length;i++){
        const line = lines[i];
        const lower = line.toLowerCase();
        
        if(lower.includes("farmer name as per aadhar in english") || lower.includes("farmer name in english")){
          if(line.includes(":")){
            const val = line.split(":").slice(1).join(":").trim();
            if(val && !val.toLowerCase().includes("enter")) farmerEnglish = val;
          } else if(i+1 < lines.length && lines[i+1].trim() && !lines[i+1].toLowerCase().includes("farmer")){
            farmerEnglish = lines[i+1].trim();
          }
        }

        if(lower.includes("farmer name in local language") || lower.includes("farmer name (local)")){
          if(line.includes(":")){
            const val = line.split(":").slice(1).join(":").trim();
            if(val && !val.toLowerCase().includes("enter")) farmerHindi = val;
          } else if(i+1 < lines.length && lines[i+1].trim() && !lines[i+1].toLowerCase().includes("farmer")){
            farmerHindi = lines[i+1].trim();
          }
        }
      }

      let entries = parseLandEntries(lines);
      const totalArea = computeTotalArea(entries);

      // Build address HTML - ensure proper formatting with kaima as village
      let addressHTML = "";
      
      // If village is empty or contains label text, try to get from Address In English
      if(!village || village.toLowerCase().includes("sub district") || village.toLowerCase().includes("taluka")){
        const addr = findValueByLabels(lines, ["Address In English", "Address in English"]);
        if(addr && !addr.toLowerCase().includes("enter")){
          village = addr.replace(/,$/, '').trim();
        }
      }
      
      if(village && !village.toLowerCase().includes("sub district") && !village.toLowerCase().includes("taluka") && !village.toLowerCase().includes("address")){
        addressHTML = "<b>Village:</b> " + escapeHtml(village);
        if(tehsil && !tehsil.toLowerCase().includes("sub district") && !tehsil.toLowerCase().includes("taluka") && !tehsil.toLowerCase().includes("district")){
          addressHTML += ", <b>Tehsil:</b> " + escapeHtml(tehsil);
        }
        if(district && !district.toLowerCase().includes("sub district") && !district.toLowerCase().includes("taluka") && !district.toLowerCase().includes("village")){
          addressHTML += ", <b>District:</b> " + escapeHtml(district);
        }
        if(state && !state.toLowerCase().includes("state/ut") && !state.toLowerCase().includes("district")){
          addressHTML += ", <b>State:</b> " + escapeHtml(state);
        }
        if(pin && !pin.toLowerCase().includes("pin")){
          addressHTML += ", <b>Pin:</b> " + escapeHtml(pin);
        }
      } else {
        // Try to get address from Address In English
        const addr = findValueByLabels(lines, ["Address In English", "Address in English"]);
        if(addr && !addr.toLowerCase().includes("enter")){
          addressHTML = escapeHtml(addr);
        } else {
          addressHTML = "<b>Address:</b> Not available";
        }
      }

      let landRows = "";
      for(let e of entries){
        landRows += `
          <tr>
            <td>${escapeHtml(e.dist || e.state || "N/A")}</td>
            <td>${escapeHtml(e.tehsil || "N/A")}</td>
            <td>${escapeHtml(e.village || "N/A")}</td>
            <td>${escapeHtml(e.khasra || "N/A")}</td>
            <td>${escapeHtml(e.area || "0.000")}</td>
          </tr>
        `;
      }

      if(!landRows){
        landRows = "<tr><td colspan='5'>No land data found</td></tr>";
      }

      const qrId = "qr_" + Date.now();

      const qrData = JSON.stringify({
        farmerId: farmerId || "N/A",
        name: farmerEnglish || "N/A",
        fatherName: fatherEnglish || "N/A",
        dob: dob || "N/A",
        gender: genderValue || "N/A",
        mobile: mobile || "N/A",
        aadhaar: aadhaar || "N/A",
        totalArea: totalArea || "0.000"
      });

      cardsContainer.innerHTML = `
        <div class="card card-front">
          <div class="header">
            <div><img src="https://drive.google.com/thumbnail?id=1R5VPGeoeZkU_j6hNauokr7AjSMLYFJAd&sz=w200" alt="AgriStack Logo"></div>
            <div><img src="https://drive.google.com/thumbnail?id=1Q3yP5MYoU9W7Y23dUnG8DMdeVhZXXdQZ&sz=w200" alt="Farmer Card Logo"></div>
          </div>

          <div class="content">
            <div class="front-flex">
              <img class="photo" src="${photoSrc}" alt="Farmer Photo">

              <div class="details">
                <div class="name">${escapeHtml(farmerHindi)}</div>
                <div class="name-en">${escapeHtml(farmerEnglish)}</div>
                <div class="detail-row"><b>C/O:</b> ${escapeHtml(fatherHindi)} (${escapeHtml(fatherEnglish)})</div>
                <div class="detail-row"><b>DOB:</b> ${escapeHtml(dob || "N/A")}</div>
                <div class="detail-row"><b>Gender:</b> ${escapeHtml(genderValue || "N/A")}</div>
                <div class="detail-row"><b>Mobile:</b> ${escapeHtml(mobile || "N/A")}</div>
                <div class="detail-row"><b>Aadhaar:</b> ${escapeHtml(aadhaar || "N/A")}</div>
              </div>

              <div class="qr-side">
                <div class="qr-mini" id="${qrId}"></div>
              </div>
            </div>
          </div>

          <div class="id-wrap">
            <div class="farmer-pill">
              Farmer Id: <span class="farmer-pill-num">${escapeHtml(farmerId || "N/A")}</span>
            </div>
            ${enrollmentId ? `<div class="enrollment-line">Enrollment Id: <span>${escapeHtml(enrollmentId)}</span></div>` : ''}
          </div>

          <div class="bottom-note">यह कार्ड फार्मर रजिस्ट्री के डेटा पर आधारित है। यह सरकार द्वारा जारी किया गया कार्ड नहीं है।</div>
        </div>

        <div class="card card-back">
          <div class="header">
            <div>Address / पता</div>
            <div><img src="https://drive.google.com/thumbnail?id=1R5VPGeoeZkU_j6hNauokr7AjSMLYFJAd&sz=w200" alt="Logo"></div>
          </div>

          <div class="content">
            <div class="address">${addressHTML}</div>
            
            <div class="land-header">
              <div class="land-title">Land Details / भूमि विवरण</div>
              <div class="total-area">Total Area: ${escapeHtml(totalArea)}</div>
            </div>

            <table>
              <thead>
                <tr>
                  <th>Dist</th>
                  <th>Tehsil</th>
                  <th>Village</th>
                  <th>Khasra</th>
                  <th>Area</th>
                </tr>
              </thead>
              <tbody>${landRows}</tbody>
            </table>
          </div>
        </div>
      `;

      cardsContainer.style.display = "flex";

      try{
        new QRCode(document.getElementById(qrId), {
          text: qrData,
          width: 116,
          height: 116,
          colorDark: "#000000",
          colorLight: "#ffffff",
          correctLevel: QRCode.CorrectLevel.M
        });
      }catch(err){
        document.getElementById(qrId).innerHTML =
          "<div style='font-size:11px;text-align:center;padding-top:24px;'>QR Error</div>";
        console.error(err);
      }
    }
  </script>
